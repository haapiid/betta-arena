<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/betta-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Betta Arena ($BETTA) · Every buy is a fight</title>
    <meta name="description" content="Betta Arena on Robinhood Chain: every buy of $BETTA throws a betta into the ring to fight the champion. Creator fees buy $BETTA back and sink it to the deep." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/api/card/site.png" />
    <!-- live | demo: flip with scripts/site-mode.sh on the server, no rebuild -->
    <meta name="rh-mode" content="live" />
    <meta name="theme-color" content="#04121a" />
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
